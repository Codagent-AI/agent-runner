name: CI

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go build -tags dev_audit ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # Validator delivery tests run against agent-validator built from main.
      - uses: actions/checkout@v4
        with:
          repository: Codagent-AI/agent-validator
          ref: main
          path: .ci/agent-validator
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Build agent-validator
        working-directory: .ci/agent-validator
        run: |
          bun install --frozen-lockfile
          bun run build:npm
      - run: go test -tags dev_audit -timeout 300s ./...
        env:
          AGENT_RUNNER_TEST_VALIDATOR_ENTRYPOINT: ${{ github.workspace }}/.ci/agent-validator/dist/index.js

  security-code:
    name: security-code
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: gosec -tags=dev_audit ./...
        timeout-minutes: 3

  security-deps:
    name: security-deps
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck -tags dev_audit ./...
        timeout-minutes: 2

