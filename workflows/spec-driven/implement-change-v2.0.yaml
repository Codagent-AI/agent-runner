name: implement-change
description: "Implement and validate spec-driven tasks, then prepare completion evidence and a draft pull request for human acceptance."
hidden: true
scope: workspace

params:
  - name: change_name
    required: true
  - name: change_dir
    required: true
  - name: skip_validator
    required: false
    default: "false"

steps:
  - id: resolve-change-dir
    script: resolve-change-dir.sh
    capture: canonical_change_dir
    script_inputs:
      workspace_dir: "{{workspace_dir}}"
      change_dir: "{{change_dir}}"

  - id: resolve-affected-repositories
    script: resolve-task-group.sh
    capture: affected_repositories
    script_inputs:
      workspace_dir: "{{workspace_dir}}"
      change_dir: "{{canonical_change_dir}}"
      plan_kind: "full"
      output: "repositories"

  - id: implement
    workflow: ../core/implement-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "{{canonical_change_dir}}"
      change_label: "spec-driven change"
      change_kind: "spec-driven"
      artifact_validation_instruction: 'When an approved artifact changed, read and follow `{{session_dir}}/bundled/spec-driven/definition-validation-checklist.md`, substituting "{{change_dir}}" for `<change-dir>` when validating "{{change_name}}".'
      skip_validator: "{{skip_validator}}"
      repositories: "{{affected_repositories}}"
