name: simple-change
description: "Use for a small branch-local change when you want lightweight spec-driven planning without OpenSpec or repository-local planning documents. It keeps artifacts outside the project repository and provides one guided flow for planning, independent review, validation, implementation, flow testing, and interactive refinement."

params:
  - name: change_name
    required: true

sessions:
  - name: lead-agent
    agent: lead

steps:
  - id: validate-feature-branch
    workflow: ../core/validate-feature-branch-v1.0.yaml
    params:
      workflow_name: "spec-driven:simple-change"

  - id: guard-clean-tree
    # agent-validator detect: exit 0 = unvalidated changes present, exit 2 = clean (no changes)
    command: |
      agent-validator detect; status=$?; if [ $status -eq 0 ]; then echo 'Unvalidated changes detected. Run agent-validator before planning.' >&2; exit 1; elif [ $status -ne 2 ]; then exit $status; fi

  - id: plan
    session: lead-agent
    mode: interactive
    prompt: |
      Help the user plan spec-driven change "{{change_name}}". First ask what the change is about; do not guess. You MUST use codagent:simple-plan.

      Spec-driven planning artifacts are expected to live outside the current project repository and remain independent of its commits. Help the user choose an appropriate external artifact directory and write the plan there.

      Once the user approves writing the plan, write it and continue to the next step without asking the user to review the written artifacts again.

  - id: locate-change
    session: lead-agent
    mode: autonomous
    capture: change_dir
    prompt: |
      You just planned a simple change. Output the directory containing its proposal, specifications, and tasks.md on a single line with NO other text, NO markdown fences, and NO explanation.

      Example valid output: /path/to/external/change-artifacts/my-change

  - id: review-plan
    session: lead-agent
    mode: interactive
    tools: [call_agent]
    prompt: |
      Review the completed plan for spec-driven change "{{change_name}}" with the user.

      Use codagent:call-agent with a fresh `agent: crosscheck` for one read-only artifact review. Give the child a standalone prompt requiring it to use codagent:review-spec and read the proposal, specifications, optional design, and `tasks.md` under `{{change_dir}}/`. It must treat missing optional artifact types as intentional, keep the review proportional to a small change, cite exact artifact sections for findings, and never modify files.

      Follow codagent:call-agent's verification and user-facing reporting rules. Present the child's material findings and your assessment to the user. Do not change an approved artifact in response until the user confirms the desired resolution. Apply confirmed edits, then continue to the next step without asking the user to review the written artifacts again.

  - id: validate-plan
    session: lead-agent
    mode: autonomous
    prompt: |
      Validate spec-driven change "{{change_name}}" by reading and following `{{session_dir}}/bundled/spec-driven/simple-change-validation-checklist.md`, substituting "{{change_dir}}" for `<change-dir>`.

      Fix mechanical artifact errors and repeat validation until it passes. Do not invent a product, scope, or design decision; report an unresolved semantic ambiguity instead of silently choosing one.

  - id: check-planning-artifacts
    workflow: ../core/check-planning-artifacts-v1.0.yaml
    params:
      change_dir: "{{change_dir}}"
      required_files: "proposal.md,tasks.md"
      require_specs: "true"

  - id: complete
    workflow: ../core/complete-simple-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "{{change_dir}}"
      change_label: "spec-driven change"
