name: define-change
description: "Create and interactively define a spec-driven change."
hidden: true

params:
  - name: change_name
    required: true

steps:
  - id: create
    script: create-change.sh
    script_inputs:
      change_name: "{{change_name}}"

  - id: define
    workflow: ../core/define-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "specs/changes/{{change_name}}"
      change_label: "spec-driven change"
