name: orchestrated-implement-change
description: "Implement an OpenSpec change straight from its proposal, specs, design, and test plan without a task breakdown. A lead orchestrator delegates all code changes to sub-agents, then the change is validated and a draft pull request is prepared for human acceptance."

params:
  - name: change_name
    required: true
  - name: skip_validator
    required: false
    default: "false"

steps:
  - id: implement
    workflow: ../core/orchestrated-implement-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      change_kind: "openspec"
      artifact_validation_instruction: 'When an approved artifact changed, run `openspec validate --type change "{{change_name}}"`.'
      skip_validator: "{{skip_validator}}"
