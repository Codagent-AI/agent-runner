name: simple-change
description: "Plan, crosscheck, implement, validate, flow-test, review, and archive a small branch-local OpenSpec change."

params:
  - name: change_name
    required: true

engine:
  type: openspec
  change_param: change_name

steps:
  - id: validate-feature-branch
    workflow: ../core/validate-feature-branch-v1.0.yaml
    params:
      workflow_name: "openspec:simple-change"

  - id: create
    script: create-change.sh
    script_inputs:
      change_name: "{{change_name}}"

  - id: plan
    workflow: ../core/plan-simple-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      plan_validation_instruction: 'Validate OpenSpec change "{{change_name}}" with `openspec validate --type change "{{change_name}}"`.'

  - id: validate-openspec
    script: validate-change.sh
    script_inputs:
      change_name: "{{change_name}}"

  - id: commit-plan
    workflow: ../core/commit-change-plan-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"

  - id: complete
    workflow: ../core/complete-simple-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"

  - id: archive
    script: archive-change.sh
    script_inputs:
      change_name: "{{change_name}}"
