name: implement-change
description: "Implement and validate OpenSpec tasks, then prepare completion evidence and a draft pull request for human acceptance."
hidden: true

params:
  - name: change_name
    required: true
  - name: skip_validator
    required: false
    default: "false"

steps:
  - id: implement
    workflow: ../core/implement-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      artifact_validation_instruction: 'When an approved artifact changed, run `openspec validate --type change "{{change_name}}"`.'
      skip_validator: "{{skip_validator}}"
