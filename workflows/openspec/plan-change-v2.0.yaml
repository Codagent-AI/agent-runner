name: plan-change
description: "Autonomously validate an approved OpenSpec definition and produce a reviewed task plan."
hidden: true

params:
  - name: change_name
    required: true

steps:
  - id: plan
    workflow: ../core/plan-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      definition_validation_checklist: "{{session_dir}}/bundled/openspec/definition-validation-checklist.md"
