name: orchestrate-change
description: "Use for a substantial OpenSpec change when you want to define the proposal, specifications, design, and test plan, then skip the task breakdown and have a lead orchestrator implement directly from the definition by delegating all code changes to sub-agents. Continues through evidence-based acceptance, human review, archival, and pull-request finalization."

params:
  - name: change_name
    required: true

steps:
  - id: validate-feature-branch
    workflow: ../core/validate-feature-branch-v1.0.yaml
    params:
      workflow_name: "openspec:orchestrate-change"

  - id: create
    script: create-change.sh
    script_inputs:
      change_name: "{{change_name}}"

  - id: define
    workflow: ../core/define-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      artifact_location_instruction: "Keep every OpenSpec definition artifact under the repository-local `openspec/changes/{{change_name}}/` directory."

  - id: implement
    workflow: ../core/orchestrated-implement-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      change_kind: "openspec"
      artifact_validation_instruction: 'When an approved artifact changed, run `openspec validate --type change "{{change_name}}"`.'
      skip_validator: "false"

  - id: accept
    workflow: ../core/accept-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      artifact_validation_instruction: 'If a specification changed, run `openspec validate --type change "{{change_name}}"`.'

  - id: archive
    workflow: archive-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"

  - id: finalize
    workflow: ../core/finalize-pr-v1.0.yaml
