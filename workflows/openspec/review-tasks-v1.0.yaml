name: review-tasks
description: "Independent review and autonomous correction of an OpenSpec task plan."
hidden: true

params:
  - name: change_name
    required: true

sessions:
  - name: planning-agent
    agent: lead

steps:
  - id: review-tasks
    session: planning-agent
    mode: autonomous
    tools: [call_agent]
    prompt: |
      Review and correct the implementation task plan for OpenSpec change "{{change_name}}" without involving the user. Use codagent:call-agent with a fresh `agent: crosscheck`.

      The task-specific child instructions must require it to use the codagent:review-tasks skill; read the approved proposal, every specification, the design, and `test-plan.md` under `openspec/changes/{{change_name}}/`; read `openspec/changes/{{change_name}}/tasks.md` and every file under `openspec/changes/{{change_name}}/tasks/`; inspect relevant repository structure when needed; and report only concrete task-plan defects that can be corrected by editing the task index or detailed task files. Require exact task and controlling-artifact citations. The proposal, specifications, design, and test plan are immutable approved inputs, not review targets. The child must not report definition or approach concerns, ask for a product, scope, design, or testing-strategy decision, or modify any file.

      Follow codagent:call-agent's verification and autonomous result-accounting rules. Evaluate each finding against the approved artifacts, current task files, and repository:
      - Fix valid task-plan issues, including missing coverage, incorrect fidelity, poor task boundaries, ordering or dependency problems, missing self-contained context, and inadequate done criteria.
      - Decline findings that are demonstrably incorrect, subjective, or outside task-plan scope. Never edit the approved proposal, specifications, or design in this step.
      - If a finding exposes an upstream definition concern, treat it as out of scope for task review rather than a planning blocker. Do not guess a new decision or emit `PLANNING_BLOCKED`.

      After material task-plan corrections, you may use codagent:call-agent once more with a fresh `agent: crosscheck` to verify the current task files against the same immutable definition. Use at most two crosscheck calls total. Fix any valid task-only issue from the verification response yourself; do not create another crosscheck loop.

      Continue to the next step only after the task index and detailed task files form a complete, faithful, self-contained execution contract for the approved proposal, specifications, design, and test plan. Do not write a status marker or terminal token.
