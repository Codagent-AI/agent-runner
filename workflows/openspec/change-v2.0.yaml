name: change
description: "Use for a substantial or higher-risk change in an OpenSpec project when you need the full proposal, specification, design, test plan, task breakdown, and acceptance lifecycle. It manages repository-local OpenSpec artifacts while guiding implementation, evidence-based acceptance, human review, archival, and pull-request finalization."

params:
  - name: change_name
    required: true

steps:
  - id: validate-feature-branch
    workflow: ../core/validate-feature-branch-v1.0.yaml
    params:
      workflow_name: "openspec:change"

  - id: create
    script: create-change.sh
    script_inputs:
      change_name: "{{change_name}}"

  - id: define
    workflow: ../core/define-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      artifact_location_instruction: "Keep every OpenSpec definition and planning artifact under the repository-local `openspec/changes/{{change_name}}/` directory."

  - id: plan
    workflow: ../core/plan-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      change_kind: "openspec"

  - id: implement
    workflow: ../core/implement-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      change_kind: "openspec"
      artifact_validation_instruction: 'When an approved artifact changed, run `openspec validate --type change "{{change_name}}"`.'
      skip_validator: "false"

  - id: accept
    workflow: ../core/accept-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      artifact_validation_instruction: 'If a specification changed, run `openspec validate --type change "{{change_name}}"`.'

  - id: archive
    script: archive-change.sh
    script_inputs:
      change_name: "{{change_name}}"

  - id: finalize
    workflow: ../core/finalize-pr-v1.0.yaml
