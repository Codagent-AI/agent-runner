name: change
description: "Define, plan, implement, accept, archive, and finalize an OpenSpec change."

params:
  - name: change_name
    required: true

steps:
  - id: validate-feature-branch
    workflow: ../core/validate-feature-branch-v1.0.yaml
    params:
      workflow_name: "openspec:change"

  - id: define
    workflow: define-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"

  - id: plan
    workflow: plan-change-v2.0.yaml
    params:
      change_name: "{{change_name}}"

  - id: implement
    workflow: implement-change-v2.0.yaml
    params:
      change_name: "{{change_name}}"

  - id: accept
    workflow: ../core/accept-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "openspec/changes/{{change_name}}"
      change_label: "OpenSpec change"
      artifact_validation_instruction: 'If a specification changed, run `openspec validate --type change "{{change_name}}"`.'

  - id: archive
    workflow: archive-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"

  - id: finalize
    workflow: ../core/finalize-pr-v1.0.yaml
