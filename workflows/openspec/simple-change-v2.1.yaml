name: simple-change
description: "Use for a small branch-local change when the project uses OpenSpec and you want a compact end-to-end workflow rather than the full change lifecycle. It creates OpenSpec artifacts in the configured project, independently reviews and validates the plan, implements and flow-tests the change, supports interactive refinement, and archives the result."

params:
  - name: spec_root
    required: false
    default: ""
  - name: change_name
    required: true

sessions:
  - name: lead-agent
    agent: lead

workspace_dirs: ["{{openspec.spec_root}}"]

steps:
  - id: resolve-openspec-root
    script: resolve-openspec-root.sh
    script_inputs:
      change_name: "{{change_name}}"
      spec_root: "{{spec_root}}"
      operation: create
      session_dir: "{{session_dir}}"
    capture: openspec
    capture_format: json

  - id: validate-feature-branch
    workflow: ../core/validate-feature-branch-v1.0.yaml
    params:
      workflow_name: "openspec:simple-change"

  - id: create
    script: create-change.sh
    script_inputs:
      spec_root: "{{openspec.spec_root}}"
      spec_external: "{{openspec.external}}"
      change_name: "{{change_name}}"

  - id: plan
    workflow: simple-change-plan-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      spec_root: "{{openspec.spec_root}}"
      change_dir: "{{openspec.change_dir}}"
      context_instruction: "{{openspec.context_instruction}}"

  - id: review-plan
    session: lead-agent
    mode: interactive
    tools: [call_agent]
    prompt: |
      You MUST use the codagent:call-agent skill with a fresh `agent: crosscheck` for one read-only artifact review of OpenSpec change "{{change_name}}". Do not review the artifacts yourself.

      Give the child a standalone prompt requiring it to use codagent:review-spec and read the proposal, specifications, optional design, and `tasks.md` under `{{openspec.change_dir}}/`. It must treat missing optional artifact types as intentional, keep the review proportional to a small change, cite exact artifact sections for findings, and never modify files.

      Follow codagent:call-agent's verification and user-facing reporting rules. Present the child's material findings and your assessment to the user. Do not change an approved artifact in response until the user confirms the desired resolution. Apply confirmed edits, then continue to the next step without asking the user to review the written artifacts again.

      {{openspec.context_instruction}}

  - id: validate-plan
    session: lead-agent
    mode: autonomous
    prompt: |
      {{openspec.simple_validate_instruction}}

      Fix mechanical artifact errors and repeat validation until it passes. Do not invent a product, scope, or design decision; report an unresolved semantic ambiguity instead of silently choosing one.

      {{openspec.context_instruction}}

  - id: check-planning-artifacts
    workflow: ../core/check-planning-artifacts-v1.0.yaml
    params:
      change_dir: "{{openspec.change_dir}}"
      required_files: "proposal.md,tasks.md"
      require_specs: "true"

  - id: validate-openspec
    script: validate-change.sh
    script_inputs:
      spec_root: "{{openspec.spec_root}}"
      spec_external: "{{openspec.external}}"
      change_name: "{{change_name}}"
    repair:
      session: lead-agent
      prompt: |
        {{openspec.validation_failure_instruction}} Fix mechanical artifact errors under `{{openspec.change_dir}}/` only. Do not invent a product, scope, or design decision. Never declare success yourself; the check that runs after you decides. If only a human can resolve the failure, make no unsafe change, explain why, and end your response with the line `REPAIR_BLOCKED`.

        {{openspec.context_instruction}}

  - id: commit-plan
    skip_if: 'sh: test {{openspec.commit_plan}} = false'
    workflow: ../core/commit-change-plan-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "{{openspec.change_dir}}"

  - id: complete
    workflow: ../core/complete-simple-change-v1.0.yaml
    params:
      context_instruction: "{{openspec.context_instruction}}"
      change_name: "{{change_name}}"
      change_dir: "{{openspec.change_dir}}"
      change_label: "OpenSpec change"

  - id: archive
    workflow: archive-change-v1.1.yaml
    params:
      spec_root: "{{openspec.spec_root}}"
      spec_external: "{{openspec.external}}"
      context_instruction: "{{openspec.context_instruction}}"
      change_name: "{{change_name}}"

  # These closing steps intentionally remain top-level in each entry for phase caps.
  # jscpd:ignore-start
  - id: check-spec-leak
    script: check-spec-leak.sh
    script_inputs:
      spec_root: "{{openspec.spec_root}}"
      spec_root_input: "{{openspec.spec_root_input}}"
      session_dir: "{{session_dir}}"
    skip_if: 'sh: test {{openspec.external}} = false'
    repair:
      session: lead-agent
      max: 1
      prompt: |
        The external spec path leak check failed. Fix PR title/body with gh pr edit or the bundled update-pr-body.sh, preserving human text outside the generated block. You may add a follow-up commit removing leaked paths from tracked files. Never rewrite history or force-push. A leaked pushed commit message cannot be repaired: report it and end with REPAIR_BLOCKED. Never declare success yourself; the check that runs after you decides.
        {{openspec.context_instruction}}

  - id: report-spec-changes
    script: report-spec-changes.sh
    script_inputs:
      spec_root: "{{openspec.spec_root}}"
      change_name: "{{change_name}}"
      session_dir: "{{session_dir}}"
    skip_if: 'sh: test {{openspec.external}} = false'
  # jscpd:ignore-end
