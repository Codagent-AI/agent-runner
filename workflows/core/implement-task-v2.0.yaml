name: implement-task
description: "Implement a single task in the implementor session and require committed progress; validation is the caller's concern."
hidden: true

params:
  - name: task_file
    required: true
  - name: run_session_report
    required: false
    default: "false"

# The implementor session is named so a later validation repair resumes the
# agent that wrote the code instead of starting a fresh one.
sessions:
  - name: implementor-agent
    agent: implementor

steps:
  - id: check-task-file
    command: |
      if [ ! -s "{{task_file}}" ]; then
        echo "ERROR: task file does not exist or is empty: {{task_file}}" >&2
        echo "Cannot implement a task with no specification. Aborting." >&2
        exit 1
      fi

  - id: check-clean-before-task
    command: |
      if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
        echo "tracked worktree changes exist before task implementation; commit or remove them before continuing" >&2
        exit 1
      fi

  - id: record-task-start
    command: git rev-parse --verify HEAD
    capture: task_start_head

  # Reserves a record path unique to this task execution for its external delivery record.
  # It runs only on a fresh task start; resume keeps the capture and the record.
  - id: prepare-task-delivery
    script: prepare-task-delivery.sh
    script_inputs:
      session_dir: "{{session_dir}}"
      task_file: "{{task_file}}"
      starting_head: "{{task_start_head}}"
    capture: task_delivery
    capture_format: json

  - id: generate-code
    session: implementor-agent
    mode: autonomous
    prompt: |
      Implement the task described in {{task_file}}. When you are done implementing, commit your changes following the project's commit message conventions and prepend [{{step_id}}]. Then summarize to the user what you changed.

      Do not run Agent Validator (`agent-validator run`, `review`, or `check`) here, directly or through any skill. This gets called explicitly in a later workflow step. Verify with the project's own relevant tests and checks, as its AGENTS.md describes.

      Implement this yourself. Do not use the codagent:orchestrate-change skill here.

  - id: check-clean
    command: test -z "$(git status --porcelain)"
    continue_on_failure: true

  - id: commit-leftovers-if-needed
    session: implementor-agent
    mode: autonomous
    prompt: |
      There are uncommitted changes leftover after implementing the task described in {{task_file}}. Run git status and git diff to review them. Only stage and commit files that are related to this task and appropriate to check into git — ignore unrelated changes, generated artifacts, or files that should be gitignored. Follow the project's commit message conventions and prepend [{{step_id}}]. Summarize which files you committed and which you left out, and why.

      Do not run Agent Validator (`agent-validator run`, `review`, or `check`) here, directly or through any skill. This gets called explicitly in a later workflow step. Verify with the project's own relevant tests and checks, as its AGENTS.md describes.
    skip_if: previous_success

  - id: verify-task-commit
    script: verify-task-commit.sh
    script_inputs:
      starting_head: "{{task_start_head}}"
      started_at: "{{task_delivery.started_at}}"
      record_path: "{{task_delivery.record_path}}"
    repair:
      session: implementor-agent
      max: 1
      prompt: |
        This repository shows no commit for the task since {{task_start_head}}. First inspect `git status --porcelain`, `git diff --cached --stat`, and `git diff --stat`.

        If the task's deliverable belongs in this repository and is present in the worktree, commit only an explicit list of task-related paths (`git commit -- <paths>`), leaving every unrelated staged or unstaged file exactly as it is, following project conventions with the `[verify-task-commit]` prefix. Do not create an empty or placeholder commit.

        If the task's work was legitimately delivered as commits in a local checkout of a different repository, and you have verified with read-only git commands that those commits are pushed (contained in a remote-tracking branch there), record the delivery instead of committing here. Write this JSON file, and nothing else, to `{{task_delivery.record_path}}`:

        ```json
        {"repository": "<absolute path of that checkout>", "commits": ["<full commit ID>", "..."], "branch": "<branch name>", "pull_request": "<pull request URL>"}
        ```

        `branch` and `pull_request` are optional; list every commit that delivers the task. Make no commit in this repository, and do not end with `REPAIR_BLOCKED` in that case. Do not push, create or move branches, commit, or otherwise modify the external repository: only inspect it and write the record.

        Make no commit, explain why, and end your response with the line `REPAIR_BLOCKED` when the work was delivered elsewhere but its commits are not pushed, when there is no local checkout of the repository that holds it, when the task conflicts with this repository, or when task-related changes cannot be isolated safely from unrelated ones. Report only facts you have verified (repository, branch, commit, whether pushed), writing `unknown` for anything unverified.

        Do not run Agent Validator (`agent-validator run`, `review`, or `check`) here, directly or through any skill. This gets called explicitly in a later workflow step. Verify with the project's own relevant tests and checks, as its AGENTS.md describes.

        Never declare success yourself; the check that runs after you decides.

  - id: session-report
    session: implementor-agent
    mode: autonomous
    prompt: |
      Run the codagent:session-report skill against the task file {{task_file}}.

      Do not run Agent Validator (`agent-validator run`, `review`, or `check`) here, directly or through any skill.
    # sh: skip_if values are interpolated with shell quoting; leave the placeholder
    # unquoted here so a literal true compares as true after interpolation.
    skip_if: 'sh: test {{run_session_report}} != true'
