name: complete-simple-change
description: "Implement, flow-test, and review a small structured change once per planned repository."
hidden: true
scope: workspace

params:
  - name: change_name
    required: true
  - name: change_dir
    required: true
  - name: change_label
    required: true
  - name: repositories
    required: true

sessions:
  - name: lead-agent
    agent: lead
  - name: flow-tester
    agent: tester

steps:
  - id: implement-task-groups
    scope: repositories
    steps:
      - id: repository-preflight
        workflow: ../core/validate-feature-branch-v1.0.yaml
        params:
          workflow_name: "{{change_label}} simple implementation for {{repository_name}}"

      - id: resolve-repository-task
        script: resolve-task-group.sh
        capture: repository_task_glob
        script_inputs:
          workspace_dir: "{{workspace_dir}}"
          change_dir: "{{change_dir}}"
          plan_kind: "simple"
          output: "task-pattern"
          repository_name: "{{repository_name}}"

      - id: implement-tasks
        loop:
          over: "{{repository_task_glob}}"
          as: task_file
          require_matches: true
        steps:
          - id: implement
            workflow: implement-task-v1.0.yaml
            params:
              task_file: "{{task_file}}"
              run_session_report: "true"
              skip_validator: "false"

      - id: test
        session: flow-tester
        mode: autonomous
        prompt: |
          For repository {{repository_name}} at {{repository_dir}}, with shared workspace {{workspace_dir}}, use codagent:test-flows for the active repository only. Read artifacts under `{{change_dir}}/`, write `{{repository_output_dir}}/test-flows.md`, and store screenshots only under `{{repository_output_dir}}`.

      - id: review
        session: lead-agent
        mode: interactive
        prompt: |
          Review {{change_label}} "{{change_name}}" with the user for repository {{repository_name}} at {{repository_dir}}, with shared workspace {{workspace_dir}}. Read only `{{repository_output_dir}}/test-flows.md` and active-repository session reports. Apply approved local fixes with codagent:implement-with-tdd, validate, commit, and retain a draft PR.

  - id: finalize-repositories
    workflow: finalize-repositories-v1.0.yaml
    params:
      repositories: "{{repositories}}"
