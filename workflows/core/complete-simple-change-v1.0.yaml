name: complete-simple-change
description: "Implement, flow-test, and review a small structured change once per planned repository."
hidden: true
scope: workspace

params:
  - name: change_name
    required: true
  - name: change_dir
    required: true
  - name: change_label
    required: true
  - name: repositories
    required: true

sessions:
  - name: lead-agent
    agent: lead
  - name: flow-tester
    agent: tester

steps:
  - id: implement-task-groups
    scope: repositories
    steps:
      - id: repository-preflight
        workflow: ../core/validate-feature-branch-v1.0.yaml
        params:
          workflow_name: "{{change_label}} simple implementation for {{repository_name}}"

      - id: resolve-repository-task
        script: resolve-task-group.sh
        capture: repository_task_glob
        script_inputs:
          workspace_dir: "{{workspace_dir}}"
          change_dir: "{{change_dir}}"
          plan_kind: "simple"
          output: "task-pattern"
          repository_name: "{{repository_name}}"

      - id: implement-tasks
        loop:
          over: "{{repository_task_glob}}"
          as: task_file
          require_matches: true
        steps:
          - id: implement
            workflow: implement-task-v1.0.yaml
            params:
              task_file: "{{task_file}}"
              run_session_report: "true"
              skip_validator: "false"

  - id: test
    session: flow-tester
    mode: autonomous
    prompt: |
      Use codagent:test-flows to perform lightweight branch-local flow testing for implemented {{change_label}} "{{change_name}}" from workspace {{workspace_dir}}.

      Read the approved artifacts under `{{change_dir}}/`. Read implementation evidence only in persisted repository order through `{{session_dir}}/output/repository-evidence-index.json`; do not glob repository directories. Exercise representative public flows proportionally to this small change across every affected repository and their integration points. Write a concise aggregate report to `{{session_dir}}/output/test-flows.md` and place screenshots beneath that aggregate output directory. Preserve findings, evidence, ambiguities, and limitations accurately. Do not modify tracked files or fix findings.

  - id: review
    session: lead-agent
    mode: interactive
    tools: [call_agent]
    prompt: |
      Help the user review implemented {{change_label}} "{{change_name}}" from workspace {{workspace_dir}}.

      Read `{{session_dir}}/output/test-flows.md` and repository implementation reports only through `{{session_dir}}/output/repository-evidence-index.json`. Present the tester's material findings, evidence, limitations, and consequential unresolved assumptions before your own assessment.

      Confirm consequential behavioral or design decisions and avoid material scope expansion. Apply workspace-owned artifact changes directly. Record every approved implementation-repository fix in `{{session_dir}}/output/acceptance-remediation.json`, using a separate workspace section and entries keyed only by selected repository names. Include codagent:implement-with-tdd, unit coverage where applicable, practical integration/end-to-end regression coverage, validation, commit, push, and draft-PR-head verification in each repository remediation instruction. Do not directly modify an implementation repository here.

      Continue only when the user says testing and review are complete.

  - id: validate-remediation-ledger
    script: validate-remediation-ledger.sh
    script_inputs:
      ledger: "{{session_dir}}/output/acceptance-remediation.json"
      repositories: "{{repositories}}"

  - id: remediate-repositories
    scope: repositories
    steps:
      - id: remediate-repository
        workflow: ../core/remediate-repository-v1.0.yaml
        params:
          change_dir: "{{change_dir}}"

  - id: finalize-repositories
    scope: repositories
    steps:
      - id: finalize-repository-group
        workflow: finalize-repositories-v1.0.yaml
        params:
          repositories: "{{repositories}}"
