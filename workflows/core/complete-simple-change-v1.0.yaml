name: complete-simple-change
description: "Implement, flow-test, and interactively review a small structured change."
hidden: true

params:
  - name: change_name
    required: true
  - name: change_dir
    required: true
  - name: change_label
    required: true

sessions:
  - name: lead-agent
    agent: lead
  - name: flow-tester
    agent: tester

steps:
  - id: implement
    workflow: implement-task-v1.0.yaml
    params:
      task_file: "{{change_dir}}/tasks.md"
      run_session_report: "true"
      skip_validator: "false"

  - id: test
    session: flow-tester
    mode: autonomous
    prompt: |
      Use codagent:test-flows to perform lightweight branch-local flow testing for implemented {{change_label}} "{{change_name}}".

      Read the approved artifacts under `{{change_dir}}/` and relevant implementation evidence under `{{session_dir}}/output/`. Exercise representative public flows proportionally to this small change. Write a concise evidence report to `{{session_dir}}/output/test-flows.md` and place any UI screenshots beneath that output directory. Preserve material findings, evidence, ambiguities, and limitations accurately. Do not modify tracked files or fix findings.

  - id: review
    session: lead-agent
    mode: interactive
    tools: [call_agent]
    prompt: |
      Help the user review implemented {{change_label}} "{{change_name}}".

      Read `{{session_dir}}/output/test-flows.md`. Show the tester's material findings, evidence, and limitations before your own assessment. Also inspect the implementation session report under `{{session_dir}}/output/` and discuss any consequential unresolved assumption with the user.

      Help the user review and request fixes or minor enhancements without material scope expansion. Confirm consequential behavioral or design changes before editing. Before fixing a defect, invoke codagent:implement-with-tdd and follow red-green-refactor; add unit coverage where applicable and a practical integration or end-to-end regression test when it meaningfully protects the affected public flow. Update active specifications only when a decision changes or clarifies normative observable behavior.

      After tracked changes, run relevant targeted checks, invoke validator-run, and commit related changes that belong to the current project repository following project conventions with the `[{{step_id}}]` prefix. Leave artifacts outside the repository uncommitted. If a changed public flow warrants another hands-on check, recommend targeted verification. When the user agrees, resume `flow-tester` with the prior finding, affected flow, and direct dependencies; require codagent:test-flows in targeted scope rather than a new broad pass, then present its exact result. Address approved actionable findings and repeat targeted verification when warranted until the user says review is complete. Do not create status files or hide an unresolved result behind a success claim.

      Continue to the next step only when the user says testing and review are complete.
