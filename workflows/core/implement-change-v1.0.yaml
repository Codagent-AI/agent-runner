name: implement-change
description: "Implement each planned repository task group, then prepare workspace-owned acceptance evidence."
hidden: true
scope: workspace

params:
  - name: change_name
    required: true
  - name: change_dir
    required: true
  - name: change_label
    required: true
  - name: change_kind
    required: true
  - name: artifact_validation_instruction
    required: true
  - name: repositories
    required: true
  - name: skip_validator
    required: false
    default: "false"

sessions:
  - name: lead-agent
    agent: lead
  - name: acceptance-tester
    agent: tester

steps:
  - id: validate-change-name
    script: validate-change-name.sh
    script_inputs:
      change_name: "{{change_name}}"

  - id: check-plan
    script: validate-planning-artifacts.sh
    script_inputs:
      change_name: "{{change_name}}"
      change_dir: "{{change_dir}}"
      change_kind: "{{change_kind}}"
      require_tasks: "true"

  - id: implement-task-groups
    workflow: implement-repository-task-group-v1.0.yaml
    params:
      repositories: "{{repositories}}"
      change_dir: "{{change_dir}}"
      change_label: "{{change_label}}"
      skip_validator: "{{skip_validator}}"

  - id: complete-task-index
    session: lead-agent
    mode: autonomous
    prompt: |
      All repository task groups for {{change_label}} "{{change_name}}" completed. From workspace {{workspace_dir}}, update only `{{change_dir}}/tasks.md` to check every completed entry. Preserve ordered repository groups and links. Commit this workspace-owned index when it is tracked here.

  - id: verify-task-index
    command: |
      if grep -Eq '^[[:space:]]*-[[:space:]]+\[[[:space:]]\]' "{{change_dir}}/tasks.md"; then
        echo "tasks.md still contains incomplete task entries" >&2
        exit 1
      fi

  - id: prepare-acceptance
    session: lead-agent
    mode: autonomous
    tools: [call_agent]
    prompt: |
      Prepare aggregate acceptance for {{change_label}} "{{change_name}}" from workspace {{workspace_dir}}. Read repository evidence only in the persisted order from `{{session_dir}}/output/repository-evidence-index.json`; do not glob repository directories. Aggregate handoffs belong under `{{session_dir}}/output/`.

      Use codagent:call-agent with `session: acceptance-tester`. Give it the approved artifacts under `{{change_dir}}/`, the evidence index, and aggregate output directory. The test plan was structurally validated before implementation. Require codagent:prepare-acceptance with verification scope: `full` for the first pass. It must write `acceptance-assumptions.md`, `acceptance-impact-scope.md`, `acceptance-flow-evidence.md`, and `acceptance-handoff.md` in the aggregate output directory.

      Use at most three acceptance-tester calls. Do not directly modify implementation repositories in this workspace step. Record approved implementation remediation in `{{session_dir}}/output/acceptance-remediation.json`, with a workspace section and selected-repository-keyed entries. Mark `ACCEPTANCE_COMPLETE` only with complete current evidence; otherwise preserve an honest handoff.

  - id: verify-acceptance-handoff
    command: test -s "{{session_dir}}/output/acceptance-handoff.md"
