name: implement-change
description: "Implement each planned repository task group, then prepare workspace-owned acceptance evidence."
hidden: true
scope: workspace

params:
  - name: change_name
    required: true
  - name: change_dir
    required: true
  - name: change_label
    required: true
  - name: change_kind
    required: true
  - name: artifact_validation_instruction
    required: true
  - name: repositories
    required: true
  - name: skip_validator
    required: false
    default: "false"

sessions:
  - name: lead-agent
    agent: lead
  - name: acceptance-tester
    agent: tester

steps:
  - id: validate-change-name
    script: validate-change-name.sh
    script_inputs:
      change_name: "{{change_name}}"

  - id: check-plan
    script: validate-planning-artifacts.sh
    script_inputs:
      change_name: "{{change_name}}"
      change_dir: "{{change_dir}}"
      change_kind: "{{change_kind}}"
      require_tasks: "true"

  - id: implement-task-groups
    scope: repositories
    steps:
      - id: implement-repository-task-group
        workflow: implement-repository-task-group-v1.0.yaml
        params:
          repositories: "{{repositories}}"
          change_dir: "{{change_dir}}"
          change_label: "{{change_label}}"
          skip_validator: "{{skip_validator}}"

  - id: complete-task-index
    session: lead-agent
    mode: autonomous
    prompt: |
      Every implementation task for {{change_label}} "{{change_name}}" has completed successfully, including its implementation commit and, unless `skip_validator` is `true`, task-compliance validation.

      Update `{{change_dir}}/tasks.md` so each checklist entry corresponding to a task file under `{{change_dir}}/tasks/*.md` is checked. Do not change task wording, task-file content, requirements, design, or implementation. Verify the index still links to every task file and contains no unchecked task entry. Preserve ordered repository task groups.

      If the index changed and belongs to the current project repository, commit only that file following the project's commit message conventions and prepend `[{{step_id}}]`. If it lives outside the repository, leave it uncommitted. If it was already correct, do not create an empty commit.

  - id: verify-task-index
    command: |
      if grep -Eq '^[[:space:]]*-[[:space:]]+\[[[:space:]]\]' "{{change_dir}}/tasks.md"; then
        echo "tasks.md still contains incomplete task entries" >&2
        exit 1
      fi

  - id: prepare-acceptance
    session: lead-agent
    mode: autonomous
    tools: [call_agent]
    prompt: |
      Prepare {{change_label}} "{{change_name}}" for human acceptance by orchestrating an independent acceptance tester. Do not perform acceptance flow testing yourself and do not directly modify implementation repositories in this workspace-scoped step.

      Use codagent:call-agent with `session: acceptance-tester`. Its first use creates a fresh independent tester; later calls resume it. Require codagent:prepare-acceptance with:
      - approved artifacts under `{{change_dir}}/` and authoritative test plan `{{change_dir}}/test-plan.md`;
      - implementation reports and other repository evidence read only in persisted order through `{{session_dir}}/output/repository-evidence-index.json` (never by globbing repository directories);
      - run metadata from `{{session_dir}}/audit.log`;
      - aggregate evidence directory `{{session_dir}}/output/`;
      - verification scope: `full` for the first pass.

      The authoritative test plan was structurally validated before implementation. Instruct the tester to execute its applicable `AT-*` inventory under the required skill.
      The first pass must exercise every required `AT-*` and every conditional `AT-*` whose activation condition holds. A substitute is allowed only when that obligation explicitly permits it. Missing applicable-flow evidence is an impediment and cannot produce `ACCEPTANCE_COMPLETE`.

      Follow codagent:call-agent's verification and autonomous result-accounting rules after every pass. Inspect durable evidence and account for every in-scope finding. Preserve approved behavior, scope, design, and testing strategy. Record product, scope, or design ambiguity in `{{session_dir}}/output/acceptance-assumptions.md` rather than deciding it silently.

      Because implementation repositories are isolated behind a later remediation fan-out, do not fix repository findings here. Record actionable fixes in `{{session_dir}}/output/acceptance-remediation.json` using a separate workspace section and selected-repository-keyed entries. The file must exist even when empty and must never name an unselected repository.

      Use at most three acceptance-tester calls. A later call must reproduce the prior finding and exercise only affected and directly dependent flows, retaining the earlier full-pass evidence for unaffected flows. Before it, write `acceptance-impact-scope.md` naming the affected `AT-*` obligations and rationale. Do not repeat an unchanged impediment indefinitely.

      The tester must preserve `acceptance-flow-evidence.md`, `acceptance-assumptions.md`, and `acceptance-handoff.md` under the aggregate output directory. Verify referenced evidence exists and every required or activated conditional `AT-*` has passing evidence before claiming completion. Reserve `HT-*` items for the user.

      Whether testing converges or not, ensure `acceptance-handoff.md` clearly states the current outcome. Overwrite `{{session_dir}}/output/acceptance-preparation-status.txt` with exactly `ACCEPTANCE_COMPLETE` after convergence or `ACCEPTANCE_FAILED` after three unsuccessful calls. Preserve an honest handoff and remaining findings on failure.

  - id: verify-acceptance-handoff
    command: |
      if [ ! -s "{{session_dir}}/output/acceptance-handoff.md" ]; then
        echo "acceptance handoff is missing or empty" >&2
        exit 1
      fi
      status=$(sed '/^[[:space:]]*$/d' "{{session_dir}}/output/acceptance-preparation-status.txt" | tail -n 1)
      case "$status" in
        ACCEPTANCE_COMPLETE|ACCEPTANCE_FAILED)
          ;;
        *)
          echo "invalid acceptance preparation status: $status" >&2
          exit 1
          ;;
      esac
