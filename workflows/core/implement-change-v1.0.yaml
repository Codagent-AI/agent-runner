name: implement-change
description: "Implement and validate change tasks, then prepare completion evidence and a draft pull request for human acceptance."
hidden: true

params:
  - name: change_name
    required: true
  - name: change_dir
    required: true
  - name: change_label
    required: true
  - name: change_kind
    required: true
  - name: artifact_validation_instruction
    required: true
  - name: skip_validator
    required: false
    default: "false"

sessions:
  - name: lead-agent
    agent: lead
  - name: acceptance-tester
    agent: tester

steps:
  - id: validate-change-name
    script: validate-change-name.sh
    script_inputs:
      change_name: "{{change_name}}"

  - id: validate-skip-validator
    script: validate-boolean-param.sh
    script_inputs:
      name: skip_validator
      value: "{{skip_validator}}"

  - id: check-plan
    script: validate-planning-artifacts.sh
    script_inputs:
      change_name: "{{change_name}}"
      change_dir: "{{change_dir}}"
      change_kind: "{{change_kind}}"
      require_tasks: "true"

  - id: implement-tasks
    loop:
      over: "{{change_dir}}/tasks/*.md"
      as: task_file
      require_matches: true
    steps:
      - id: implement-single-task
        workflow: ../core/implement-task-v1.0.yaml
        params:
          task_file: "{{task_file}}"
          run_session_report: "true"
          skip_validator: "{{skip_validator}}"

  - id: complete-task-index
    session: lead-agent
    mode: autonomous
    prompt: |
      Every implementation task for {{change_label}} "{{change_name}}" has now completed successfully, including its implementation commit and, unless `skip_validator` is `true`, task-compliance validation.

      Update `{{change_dir}}/tasks.md` so each checklist entry corresponding to a task file under `{{change_dir}}/tasks/*.md` is checked. Do not change task wording, task-file content, requirements, design, or implementation. Verify the index still links to every task file and contains no unchecked task entry.

      If the index changed and belongs to the current project repository, commit only that file following the project's commit message conventions and prepend `[{{step_id}}]`. If it lives outside the repository, leave it uncommitted. If it was already correct, do not create an empty commit.

  - id: verify-task-index
    command: |
      if grep -Eq '^[[:space:]]*-[[:space:]]+\[[[:space:]]\]' "{{change_dir}}/tasks.md"; then
        echo "tasks.md still contains incomplete task entries" >&2
        exit 1
      fi
    repair:
      session: lead-agent
      prompt: |
        `{{change_dir}}/tasks.md` still has unchecked task entries. Update it so each checklist entry corresponding to a task file under `{{change_dir}}/tasks/*.md` is checked, without changing task wording, task-file content, requirements, design, or implementation. Commit only that file, following the project's commit message conventions. Never declare success yourself; the check that runs after you decides. If only a human can resolve the failure, make no unsafe change, explain why, and end your response with the line `REPAIR_BLOCKED`.

  - id: verify-change
    workflow: verify-change-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "{{change_dir}}"
      change_label: "{{change_label}}"
      artifact_validation_instruction: "{{artifact_validation_instruction}}"
      skip_validator: "{{skip_validator}}"
