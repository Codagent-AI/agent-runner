name: plan-change
description: "Autonomously validate an approved change definition and produce a reviewed task plan."
hidden: true

params:
  - name: change_name
    required: true
  - name: change_dir
    required: true
  - name: change_label
    required: true
  - name: change_kind
    required: true

sessions:
  - name: planning-agent
    agent: lead

steps:
  - id: check-definition
    workflow: check-definition-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "{{change_dir}}"
      change_label: "{{change_label}}"
      change_kind: "{{change_kind}}"

  - id: tasks
    session: planning-agent
    mode: autonomous
    prompt: |
      Create the implementation task breakdown for {{change_label}} "{{change_name}}". Read the approved proposal, specifications, design, and `test-plan.md` under `{{change_dir}}/`, then use the codagent:plan-tasks skill.

      Task planning is autonomous because the definition artifacts have already been approved. This instruction overrides the skill's confirmation gate: do NOT ask the user to approve the number or grouping of tasks. Choose a right-sized breakdown using your best judgment and continue directly to writing the task files.

      You MUST create detailed task files under `{{change_dir}}/tasks/*.md` and `{{change_dir}}/tasks.md` as an index linking to them. At least one non-empty `tasks/*.md` file is required.

  - id: review-tasks
    workflow: review-tasks-v1.0.yaml
    params:
      change_name: "{{change_name}}"
      change_dir: "{{change_dir}}"
      change_label: "{{change_label}}"

  - id: check-plan
    script: validate-planning-artifacts.sh
    script_inputs:
      change_name: "{{change_name}}"
      change_dir: "{{change_dir}}"
      change_kind: "{{change_kind}}"
      require_tasks: "true"
    repair:
      session: planning-agent
      prompt: |
        The task plan for {{change_label}} "{{change_name}}" failed deterministic validation. Apply only mechanical fixes to the existing artifacts under `{{change_dir}}/` to satisfy the reported conformance problems. Do not re-plan, redesign, or add or remove tasks. Never declare success yourself; the check that runs after you decides. If only a human can resolve the failure, make no unsafe change, explain why, and end your response with the line `REPAIR_BLOCKED`.

  - id: commit-plan
    script: commit-change-plan.sh
    script_inputs:
      change_name: "{{change_name}}"
      change_dir: "{{change_dir}}"
    skip_if: 'sh: test {{change_kind}} = spec-driven'
    repair:
      session: planning-agent
      prompt: commit only {{change_dir}} following repository conventions. Never declare success yourself; the check that runs after you decides. If only a human can resolve the failure, make no unsafe change, explain why, and end your response with the line `REPAIR_BLOCKED`.
