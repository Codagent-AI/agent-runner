name: commit-change-plan
description: "Commit a structured change plan and advance the Validator baseline when the selected validation workflow runs Agent Validator."
hidden: true

params:
  - name: change_name
    required: true
  - name: change_dir
    required: true
  - name: validation_workflow
    required: false
    default: ""

steps:
  - id: commit-plan
    script: commit-change-plan.sh
    script_inputs:
      change_name: "{{change_name}}"
      change_dir: "{{change_dir}}"
      validation_workflow: "{{validation_workflow}}"
