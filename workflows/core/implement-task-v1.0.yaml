name: implement-task
description: "Implement a single task, require committed progress, and optionally retry task-compliance validation."
hidden: true

params:
  - name: task_file
    required: true
  - name: run_session_report
    required: false
    default: "false"
  - name: skip_validator
    required: false
    default: "false"

steps:
  - id: validate-skip-validator
    script: validate-boolean-param.sh
    script_inputs:
      name: skip_validator
      value: "{{skip_validator}}"

  - id: check-task-file
    command: |
      if [ ! -s "{{task_file}}" ]; then
        echo "ERROR: task file does not exist or is empty: {{task_file}}" >&2
        echo "Cannot implement a task with no specification. Aborting." >&2
        exit 1
      fi

  - id: check-clean-before-task
    command: |
      if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
        echo "tracked worktree changes exist before task implementation; commit or remove them before continuing" >&2
        exit 1
      fi

  - id: record-task-start
    command: git rev-parse --verify HEAD
    capture: task_start_head

  - id: generate-code
    agent: implementor
    session: new
    prompt: |
      Implement the task described in {{task_file}}. You MUST use the codagent:implement-with-tdd skill. When you are done implementing, commit your changes following the project's commit message conventions and prepend [{{step_id}}]. Then summarize to the user what you changed.

  - id: run-validator
    workflow: run-validator-v1.0.yaml
    params:
      task_file: "{{task_file}}"
      task_base_ref: "{{task_start_head}}"
    # skip_if parameters are shell-quoted by InterpolateShellSafeTyped. The
    # validation step above additionally constrains this value to true|false.
    skip_if: 'sh: test {{skip_validator}} = true'

  - id: check-clean
    command: test -z "$(git status --porcelain)"
    continue_on_failure: true

  - id: commit-leftovers-if-needed
    session: resume
    prompt: |
      There are uncommitted changes leftover after implementing the task described in {{task_file}}. Run git status and git diff to review them. Only stage and commit files that are related to this task and appropriate to check into git — ignore unrelated changes, generated artifacts, or files that should be gitignored. Follow the project's commit message conventions and prepend [{{step_id}}]. Summarize which files you committed and which you left out, and why.
    skip_if: previous_success

  - id: verify-task-commit
    script: verify-task-commit.sh
    script_inputs:
      starting_head: "{{task_start_head}}"

  - id: session-report
    session: resume
    prompt: |
      Run the codagent:session-report skill against the task file {{task_file}}.

      After the session report, check if validator_logs/report.txt exists and contains unresolved failures. If it does, include a ⚠️ VALIDATOR WARNING section at the end of your output summarizing the unresolved violations and recommending next steps. If the report shows all checks passed, skip this section.
    # sh: skip_if values are interpolated with shell quoting; leave the placeholder
    # unquoted here so a literal true compares as true after interpolation.
    skip_if: 'sh: test {{run_session_report}} != true'
