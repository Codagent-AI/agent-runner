name: accept-change
description: "Resolve undecided assumptions, support human review and testing, and apply requested follow-up changes."
hidden: true

params:
  - name: change_name
    required: true
  - name: change_dir
    required: true
  - name: change_label
    required: true
  - name: artifact_validation_instruction
    required: true

sessions:
  - name: lead-agent
    agent: lead
  - name: acceptance-tester
    agent: tester

steps:
  - id: resolve-assumptions
    session: lead-agent
    mode: interactive
    prompt: |
      Resolve undecided assumptions and context gaps for {{change_label}} "{{change_name}}" with the user.

      Read `{{session_dir}}/output/acceptance-assumptions.md`, the acceptance-testing outcome and unresolved-assumptions section of `{{session_dir}}/output/acceptance-handoff.md`, and relevant files under `{{change_dir}}/`. Briefly tell the user whether acceptance testing was ready or ended with remaining impediments.

      For each unresolved item, ask the user how they want to resolve it and explain the options and likely impact. Then implement the resulting code, configuration, documentation, or other changes.

      Decide whether the resolution belongs in the specifications. Update the applicable active specifications under `{{change_dir}}/specs/` when it changes or clarifies observable behavior, requirements, scope, or design that should be normative. Do not edit the proposal, design, or tasks, and omit minor technical details from specifications.

      Run relevant targeted checks. {{artifact_validation_instruction}} Commit resulting changes that belong to the current project repository using the project's conventions and the `[{{step_id}}]` prefix, then push while keeping the pull request in draft. Leave artifacts outside the repository uncommitted. Do not create an empty commit.

      Continue to next step when the unresolved items and their resulting work are complete and the user says to move on.

  - id: review-and-refine
    session: lead-agent
    mode: interactive
    prompt: |
      Help the user review, test, and request additional changes for implemented {{change_label}} "{{change_name}}". The pull request must remain a draft.

      Read `{{session_dir}}/output/acceptance-handoff.md` and its evidence. Present a concise implementation summary, validation results, what the exploratory pass exercised and deliberately did not, any `HT-*` items reserved for the user, limitations, and relevant screenshots with text equivalents. Give the user room to review and test.

      Implement user-requested fixes and minor enhancements. Confirm changes to behavior, scope, or design before editing. Do not implement requests that materially expand the change's scope or require substantial redesign.

      Before fixing a defect found during acceptance review or testing, you MUST invoke codagent:implement-with-tdd and follow its red-green-refactor process. Add unit regression coverage where applicable. Also assess and recommend an integration or end-to-end regression test for the affected user or client flow, and add it when it provides meaningful, practical coverage.

      Decide whether a requested change belongs in the specifications. Update the applicable active specifications under `{{change_dir}}/specs/` when it changes or clarifies observable behavior, requirements, scope, or design that should be normative. Do not edit the proposal, design, or tasks, and omit minor technical details from specifications.

      Run relevant targeted checks. {{artifact_validation_instruction}} Commit completed refinements that belong to the current project repository using the project's conventions and the `[{{step_id}}]` prefix, then push while keeping the pull request in draft. Leave artifacts outside the repository uncommitted. Do not create an empty commit.

      Continue to next step when the user says the requested refinements are complete and the change is ready for final validation.

  - id: recommend-reacceptance-testing
    session: lead-agent
    mode: interactive
    prompt: |
      Recommend re-acceptance testing if changes were made during assumption review or testing and refinement.

      If nothing changed, state that no re-acceptance testing is needed. Otherwise, briefly show the user what changed since the last acceptance pass, describe the exploration you would run on those changes, and ask whether they want it run.

      Continue to next step when the user accepts or declines the recommendation.

  - id: run-validator
    workflow: ../core/run-validator-v1.0.yaml

  - id: run-reacceptance-testing
    session: lead-agent
    mode: autonomous
    tools: [call_agent]
    prompt: |
      Follow the user's decision about re-acceptance testing. If no testing was recommended or the user declined it, continue to next step without running anything.

      Before testing, inspect fixes committed by final validation after the user agreed. They are part of the diff the tester must explore.

      If the user agreed, use codagent:call-agent with `session: acceptance-tester`. This resumes the tester that ran the earlier pass when available; first use creates it when this workflow runs standalone. Supply task-specific child instructions requiring codagent:prepare-acceptance with:
      - approved artifacts: `{{change_dir}}/`;
      - testing envelope and any `HT-*` obligations: `{{change_dir}}/test-plan.md`;
      - implementation evidence: `{{session_dir}}/output/*session-report*.out` and `{{session_dir}}/audit.log`;
      - evidence directory: `{{session_dir}}/output/`;
      - assumptions ledger: `{{session_dir}}/output/acceptance-assumptions.md`;
      - prior tested revision: `{{session_dir}}/output/acceptance-tested-revision.txt`, which the tester diffs against to size the exploration from what that diff moved. If that file is missing or names an unresolvable SHA, require the tester to report an impediment and explore the change as a whole.

      Follow codagent:call-agent's verification and autonomous result-accounting rules rather than performing the acceptance testing yourself. If the pass succeeds, summarize the result and continue to next step.

      If it finds an actionable defect, fix it without expanding the approved scope. Before editing, you MUST invoke codagent:implement-with-tdd and follow its red-green-refactor process. Add unit regression coverage where applicable. Also assess and recommend an integration or end-to-end regression test for the affected user or client flow, and add it when it provides meaningful, practical coverage.

      Run relevant targeted automated checks. {{artifact_validation_instruction}} Invoke the validator-run skill, incorporate its fixes, commit changes that belong to the current project repository using the project's conventions and the `[{{step_id}}]` prefix, leave artifacts outside the repository uncommitted, and push while keeping the pull request in draft. Then resume `acceptance-tester` to reproduce the prior finding and verify the fix, then read the diff since its last pass and explore what that diff moved. It must not re-run its previous pass or derive scope from what it tested before, and it must treat its prior exploration log as history rather than as coverage.

      Use at most three tester calls. Before continuing to next step, overwrite `{{session_dir}}/output/reacceptance-status.txt` with exactly one line:
      - `REACCEPTANCE_COMPLETE` when testing was not requested or the pass succeeded;
      - `REACCEPTANCE_FAILED` when three calls do not converge or a finding still requires human judgment.

      For a failed result, preserve and report the remaining findings without claiming that re-acceptance passed.

  - id: reacceptance-gate
    loop:
      max: 3
    steps:
      - id: verify-status-before-recovery
        script: reacceptance-status-gate.sh
        script_inputs:
          status_file: "{{session_dir}}/output/reacceptance-status.txt"
        continue_on_failure: true

      - id: recover-reacceptance-testing
        session: lead-agent
        mode: interactive
        tools: [call_agent]
        skip_if: previous_success
        prompt: |
          Re-acceptance testing did not converge. Read `{{session_dir}}/output/reacceptance-status.txt`, `{{session_dir}}/output/acceptance-handoff.md`, `{{session_dir}}/output/exploration-log.md` when it exists, `{{session_dir}}/output/acceptance-assumptions.md`, and `{{change_dir}}/test-plan.md`. Present the exact remaining defect, impediment, or human decision to the user and help them resolve it without discarding prior evidence or claiming that testing passed.

          Do not blindly retry an unchanged impediment. Keep this interactive step open while the user resolves an external condition. If the user wants to defer recovery, tell them to stop Agent Runner so a later workflow resume returns to this step; do not acknowledge step completion while the status remains failed.

          Once the blocker is resolved, use codagent:call-agent with `session: acceptance-tester` and require the child to use codagent:prepare-acceptance. If no prior tested revision is recorded, have it explore the change as a whole; otherwise it diffs against that revision and sizes the exploration from what the diff moved. Supply:
          - approved artifacts: `{{change_dir}}/`;
          - testing envelope and any `HT-*` obligations: `{{change_dir}}/test-plan.md`;
          - implementation evidence: `{{session_dir}}/output/*session-report*.out` and `{{session_dir}}/audit.log`;
          - evidence directory: `{{session_dir}}/output/`;
          - assumptions ledger: `{{session_dir}}/output/acceptance-assumptions.md`;
          - prior tested revision: `{{session_dir}}/output/acceptance-tested-revision.txt`.

          Follow codagent:call-agent's independent-verification and result-accounting rules. If testing finds an actionable product defect, invoke codagent:implement-with-tdd before editing, add practical regression coverage, run relevant checks and the full Validator, commit with the `[recover-reacceptance-testing]` prefix, push the draft pull request, and resume the same tester against the resulting diff.

          Preserve `REACCEPTANCE_FAILED` and the honest handoff while any defect or impediment remains. Overwrite `{{session_dir}}/output/reacceptance-status.txt` with exactly `REACCEPTANCE_COMPLETE` only after the tester reports no remaining finding for the current revision. Request completion of this interactive step only after that file and the acceptance handoff agree.

      - id: verify-reacceptance-status
        script: reacceptance-status-gate.sh
        script_inputs:
          status_file: "{{session_dir}}/output/reacceptance-status.txt"
        continue_on_failure: true
        break_if: success
