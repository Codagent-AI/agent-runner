name: accept-change
description: "Resolve undecided assumptions, support human review and testing, and apply requested follow-up changes."
hidden: true
scope: workspace

params:
  - name: change_name
    required: true
  - name: change_dir
    required: true
  - name: change_label
    required: true
  - name: artifact_validation_instruction
    required: true
  - name: repositories
    required: true

sessions:
  - name: lead-agent
    agent: lead
  - name: acceptance-tester
    agent: tester

steps:
  - id: resolve-assumptions
    session: lead-agent
    mode: interactive
    prompt: |
      Resolve undecided assumptions and context gaps for {{change_label}} "{{change_name}}" with the user.

      Read `{{session_dir}}/output/acceptance-assumptions.md`, the acceptance-testing outcome and unresolved-assumptions section of `{{session_dir}}/output/acceptance-handoff.md`, and relevant files under `{{change_dir}}/`. Briefly tell the user whether acceptance testing was ready or ended with remaining impediments.

      For each unresolved item, ask the user how they want to resolve it and explain the options and likely impact. Apply workspace-owned artifact changes directly. Record approved implementation-repository changes in `{{session_dir}}/output/acceptance-remediation.json` under the matching selected repository; do not modify implementation repositories from this workspace step.

      Decide whether the resolution belongs in the specifications. Update the applicable active specifications under `{{change_dir}}/specs/` when it changes or clarifies observable behavior, requirements, scope, or design that should be normative. Do not edit the proposal, design, or tasks, and omit minor technical details from specifications.

      Run relevant targeted checks for workspace-owned changes. {{artifact_validation_instruction}} Commit resulting changes that belong to the workspace repository using the project's conventions and the `[{{step_id}}]` prefix, then push while keeping its pull request in draft. Leave artifacts outside the repository uncommitted. Do not create an empty commit.

      Continue to next step when the unresolved items and their resulting work are complete and the user says to move on.

  - id: review-and-refine
    session: lead-agent
    mode: interactive
    prompt: |
      Help the user review, test, and request additional changes for implemented {{change_label}} "{{change_name}}". The pull request must remain a draft.

      Read `{{session_dir}}/output/acceptance-handoff.md` and its evidence. Present a concise implementation summary, validation results, testing instructions, any `HT-*` items reserved for the user, limitations, and relevant screenshots with text equivalents. Give the user room to review and test.

      Confirm changes to behavior, scope, or design before editing. Apply workspace-owned fixes and minor enhancements directly. Record approved implementation-repository fixes in `{{session_dir}}/output/acceptance-remediation.json` under the matching selected repository; do not modify those repositories here. Do not accept requests that materially expand the change's scope or require substantial redesign.

      Before fixing a workspace-owned defect, invoke codagent:implement-with-tdd and follow red-green-refactor. For repository-owned defects, put the same TDD and regression-coverage requirements into that repository's remediation entry.

      Decide whether a requested change belongs in the specifications. Update the applicable active specifications under `{{change_dir}}/specs/` when it changes or clarifies observable behavior, requirements, scope, or design that should be normative. Do not edit the proposal, design, or tasks, and omit minor technical details from specifications.

      Run relevant targeted checks for workspace-owned refinements. {{artifact_validation_instruction}} Commit them using project conventions with the `[{{step_id}}]` prefix, then push while keeping the workspace pull request in draft. Leave artifacts outside the repository uncommitted. Do not create an empty commit.

      Continue to next step when the user says the requested refinements are complete and the change is ready for final validation.

  - id: validate-remediation-ledger
    script: validate-remediation-ledger.sh
    script_inputs:
      ledger: "{{session_dir}}/output/acceptance-remediation.json"
      repositories: "{{repositories}}"

  - id: remediate-repositories
    scope: repositories
    steps:
      - id: remediate-repository
        workflow: ../core/remediate-repository-v1.0.yaml
        params:
          change_dir: "{{change_dir}}"

  - id: recommend-reacceptance-testing
    session: lead-agent
    mode: interactive
    prompt: |
      Recommend targeted manual re-acceptance testing if changes were made during assumption review or testing and refinement.

      If nothing changed, state that no re-acceptance testing is needed. Otherwise, briefly identify the affected `AT-*` obligations or user/client flows and directly dependent flows, recommend a targeted verification scope, and ask whether the user wants it run.

      Continue to next step when the user accepts or declines the recommendation.

  - id: run-validator
    workflow: ../core/run-validator-v1.0.yaml

  - id: run-reacceptance-testing
    session: lead-agent
    mode: autonomous
    tools: [call_agent]
    prompt: |
      Follow the user's decision about targeted re-acceptance testing. If no testing was recommended or the user declined it, continue to next step without running anything.

      Before testing, inspect fixes committed by final validation after the user agreed to the scope. Widen the targeted scope to cover any additional affected or directly dependent flows.

      If the user agreed, use codagent:call-agent with `session: acceptance-tester`. This resumes the tester that established the full-pass baseline when available; first use creates it when this workflow runs standalone. Supply task-specific child instructions requiring codagent:prepare-acceptance with:
      - approved artifacts: `{{change_dir}}/`;
      - authoritative test plan: `{{change_dir}}/test-plan.md`;
      - implementation evidence: `{{session_dir}}/output/*session-report*.out` and `{{session_dir}}/audit.log`;
      - evidence directory: `{{session_dir}}/output/`;
      - assumptions ledger: `{{session_dir}}/output/acceptance-assumptions.md`;
      - verification scope: the affected `AT-*` obligations and directly dependent flows agreed with the user, with a concise impact rationale;
      - prior full-pass evidence: `{{session_dir}}/output/acceptance-flow-evidence.md`.

      Follow codagent:call-agent's verification and autonomous result-accounting rules rather than performing the acceptance testing yourself. If the targeted pass succeeds, summarize the result and continue to next step.

      If it finds an actionable defect after remediation, preserve it in the aggregate handoff and mark re-acceptance failed. Do not modify an implementation repository from this workspace step or begin another unbounded remediation cycle. A subsequent acceptance run can resolve the finding explicitly.

      Use at most three tester calls. Before continuing to next step, overwrite `{{session_dir}}/output/reacceptance-status.txt` with exactly one line:
      - `REACCEPTANCE_COMPLETE` when testing was not requested or the targeted pass succeeded;
      - `REACCEPTANCE_FAILED` when three calls do not converge or a finding still requires human judgment.

      For a failed result, preserve and report the remaining findings without claiming that re-acceptance passed.

  - id: reacceptance-gate
    loop:
      max: 3
    steps:
      - id: verify-status-before-recovery
        script: reacceptance-status-gate.sh
        script_inputs:
          status_file: "{{session_dir}}/output/reacceptance-status.txt"
        continue_on_failure: true

      - id: recover-reacceptance-testing
        session: lead-agent
        mode: interactive
        tools: [call_agent]
        skip_if: previous_success
        prompt: |
          Re-acceptance testing did not converge. Read `{{session_dir}}/output/reacceptance-status.txt`, `{{session_dir}}/output/acceptance-handoff.md`, `{{session_dir}}/output/acceptance-flow-evidence.md` when it exists, `{{session_dir}}/output/acceptance-assumptions.md`, and `{{change_dir}}/test-plan.md`. Present the exact remaining defect, impediment, or human decision to the user and help them resolve it without discarding prior evidence or claiming that testing passed.

          Do not blindly retry an unchanged impediment. Keep this interactive step open while the user resolves an external condition. If the user wants to defer recovery, tell them to stop Agent Runner so a later workflow resume returns to this step; do not acknowledge step completion while the status remains failed.

          Once the blocker is resolved, use codagent:call-agent with `session: acceptance-tester` and require the child to use codagent:prepare-acceptance. Resume the tester's established evidence when trustworthy. If no full-pass baseline exists, run the full applicable `AT-*` inventory; otherwise exercise the affected and directly dependent flows identified by the handoff and retain unaffected baseline evidence. Supply:
          - approved artifacts: `{{change_dir}}/`;
          - authoritative test plan: `{{change_dir}}/test-plan.md`;
          - implementation evidence: `{{session_dir}}/output/*session-report*.out` and `{{session_dir}}/audit.log`;
          - evidence directory: `{{session_dir}}/output/`;
          - assumptions ledger: `{{session_dir}}/output/acceptance-assumptions.md`;
          - prior full-pass evidence: `{{session_dir}}/output/acceptance-flow-evidence.md`.

          Follow codagent:call-agent's independent-verification and result-accounting rules. If testing finds an actionable product defect, invoke codagent:implement-with-tdd before editing, add practical regression coverage, run relevant checks and the full Validator, commit with the `[recover-reacceptance-testing]` prefix, push the draft pull request, and resume the same tester against the affected scope.

          Preserve `REACCEPTANCE_FAILED` and the honest handoff while any defect, impediment, or required evidence remains. Overwrite `{{session_dir}}/output/reacceptance-status.txt` with exactly `REACCEPTANCE_COMPLETE` only after all applicable acceptance obligations have passing durable evidence for the current revision. Request completion of this interactive step only after that file and the acceptance handoff agree.

      - id: verify-reacceptance-status
        script: reacceptance-status-gate.sh
        script_inputs:
          status_file: "{{session_dir}}/output/reacceptance-status.txt"
        continue_on_failure: true
        break_if: success
