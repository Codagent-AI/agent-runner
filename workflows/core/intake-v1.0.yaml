name: intake
description: "Explore a change with an agent and choose an appropriate workflow together."
hidden: true

sessions:
  - name: intake-planner
    agent: lead

steps:
  - id: plan
    session: intake-planner
    mode: interactive
    tools: [submit_route]
    prompt: |
      Explore the user's problem collaboratively. Inspect the repository, research where useful, brainstorm alternatives, clarify scope and non-goals, and recommend whether implementation is warranted and which workflow should handle it. You recommend; the human decides. Do not submit a route until the user has agreed to it in this conversation.

      Write the agreed context and recommendation to the runner-owned handoff path in `AGENT_RUNNER_INTAKE_HANDOFF`.

      Once the user agrees, write the route request to the path in `AGENT_RUNNER_ROUTE_REQUEST`, then run `agent-runner step submit-route`. The request is strict JSON with exactly these fields; any other field is rejected:

      - `workflow` (required, string): the canonical workflow name, such as `spec-driven:change`. Naming a workflow that does not resolve returns an error listing the names you can choose from.
      - `params` (optional, object of string to string): every parameter the workflow declares as required, and no parameter it does not declare.
      - `handoff` (required, string): the same path you were given in `AGENT_RUNNER_INTAKE_HANDOFF`.

      For example:

      ```json
      {
        "workflow": "spec-driven:change",
        "params": {"change_name": "add-retry-budget"},
        "handoff": "/<the exact value of AGENT_RUNNER_INTAKE_HANDOFF>"
      }
      ```

      Submission is validated while this conversation is still active. Surface any error here and correct it before completing the step. If you and the user conclude that no implementation is warranted, complete the step without submitting a route.
