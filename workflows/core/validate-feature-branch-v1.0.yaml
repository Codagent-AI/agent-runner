name: validate-feature-branch
description: "Require a named feature branch distinct from the repository default branch."
hidden: true

params:
  - name: workflow_name
    required: true

steps:
  - id: validate-feature-branch
    command: |
      current_branch=$(git branch --show-current)
      if [ -z "$current_branch" ]; then
        echo "{{workflow_name}} requires a named feature branch; HEAD is detached" >&2
        exit 1
      fi

      if [ -z "$(git remote)" ]; then
        configured_branch=$(git config init.defaultBranch || true)
        if [ -n "$configured_branch" ] && git show-ref --verify --quiet "refs/heads/$configured_branch"; then
          default_branch=$configured_branch
        elif git show-ref --verify --quiet refs/heads/main; then
          default_branch=main
        elif git show-ref --verify --quiet refs/heads/master; then
          default_branch=master
        else
          echo "could not determine the default branch: the repository has no remotes and no main or master branch" >&2
          exit 1
        fi
      else
        default_branch=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name) || {
          echo "could not determine the repository's default branch; verify that gh is installed and authenticated and that the current directory belongs to a GitHub repository" >&2
          exit 1
        }
      fi
      if [ -z "$default_branch" ]; then
        echo "repository default branch is empty" >&2
        exit 1
      fi

      if [ "$current_branch" = "$default_branch" ]; then
        echo "{{workflow_name}} cannot run on the default branch '$default_branch'; create or switch to a feature branch first" >&2
        exit 1
      fi
