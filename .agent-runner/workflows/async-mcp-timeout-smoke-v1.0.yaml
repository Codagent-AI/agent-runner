name: async-mcp-timeout-smoke
description: "Manual smoke: interactive Cursor parent call_agent to a child that waits more than 60s (run with -p smoke_test)"

params:
  - name: wait_seconds
    default: "75"

steps:
  - id: long-call
    agent: cursor_interactive_smoke
    session: new
    mode: interactive
    tools: [call_agent]
    prompt: |
      Use the Runner-owned call_agent tool exactly once. Do not substitute a
      shell agent CLI, a subagent, or any other delegation path.

      Target: agent cursor_headless_smoke. Do not set session.

      Child prompt (send this text verbatim as the call prompt):
      Run one shell command: sleep {{wait_seconds}}. Do not reply until that
      command exits. Then reply with only ASYNC-MCP-OK.

      call_agent returns a call_id and a non-terminal status immediately. That
      is not the child's response. Poll get_agent_call with that call_id until
      the call is terminal. Do not treat accepted or running as success. Do not
      start a second child.

      When get_agent_call is terminal, show me the child's response text (expect
      ASYNC-MCP-OK) or the structured error. Then wait for me to continue.
