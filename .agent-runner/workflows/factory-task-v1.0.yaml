# factory-contract: factory-task/1
name: factory-task
description: "Triage and implement guarded low-risk maintenance as a chore pull request."
hidden: true

params:
  - name: issue_file
    required: true
  - name: branch_name
    required: true
  - name: contract_version
    required: true
  - name: artifact_dir
    required: false
    default: /artifacts

sessions:
  - name: lead-agent
    agent: lead
  - name: implementor-agent
    agent: implementor
  - name: tester-agent
    agent: tester

steps:
  - id: check-contract
    script: check-contract.sh
    script_inputs:
      expected_contract: factory-task/1
      declared_contract: "{{contract_version}}"

  - id: check-clean-tree
    command: test -z "$(git status --porcelain)"

  - id: record-base
    command: git rev-parse HEAD
    capture: scope_base

  - id: triage
    session: lead-agent
    mode: autonomous
    capture: triage_decision
    prompt: |
      Read {{issue_file}}, including eligible comments and prior factory PR on
      re-attempts. Decide whether this Task is bounded, low-risk maintenance
      under the Task boundary in `.agent-runner/workflows/factory-task-boundary.md`.
      Decline with doable=false when it crosses that boundary, naming where it
      belongs and the exact decision needed. Decline any decision the issue leaves open.

      Return only JSON with exactly doable (boolean), reasons (string array),
      plan (string), and user_visible (boolean). When declining, the reasons
      must state where the work belongs and the decision needed; leave plan empty.

  - id: record-triage
    script: record-triage.sh
    script_inputs:
      decision: "{{triage_decision}}"
      outcome_path: "{{artifact_dir}}/task-outcome.json"
      contract: factory-task/1
      accept_field: doable
      decision_path: "{{artifact_dir}}/task-triage.json"
    capture: doable
    continue_on_failure: true

  - id: repair-triage
    session: lead-agent
    mode: autonomous
    skip_if: previous_success
    capture: triage_decision
    prompt: |
      Re-read {{issue_file}} and return exactly one JSON object with doable,
      reasons, plan, and user_visible. No prose or code fence.

  - id: recheck-triage
    script: record-triage.sh
    script_inputs:
      decision: "{{triage_decision}}"
      outcome_path: "{{artifact_dir}}/task-outcome.json"
      contract: factory-task/1
      accept_field: doable
      decision_path: "{{artifact_dir}}/task-triage.json"
    capture: doable
    skip_if: 'sh: test "{{doable}}" = true || test "{{doable}}" = false'

  - id: triage-user-visible
    command: python3 .agent-runner/workflows/json-flag.py "{{artifact_dir}}/task-triage.json" user_visible
    capture: user_visible

  - id: seed-prefinalize-head
    command: printf ''
    capture: prefinalize_head

  - id: implement
    skip_if: 'sh: test "{{doable}}" != true'
    continue_on_failure: true
    steps:
      - id: seed-validator-status
        command: printf failed
        capture: validator_status
      - id: seed-ci-status
        command: printf ''
        capture: ci_status
      - id: seed-pr-details
        command: printf '{}'
        capture: pr_details
      - id: seed-test-flow-report
        command: printf ''
        capture: test_flow_report
      - id: seed-failure-reasons
        command: printf '[]'
        capture: failure_reasons
      - id: seed-annotation-status
        command: printf failed
        capture: annotation_status
      - id: seed-scope-status
        command: printf crossed
        capture: scope_status
      - id: create-branch
        command: git checkout -b "{{branch_name}}"
      - id: implement-task
        session: implementor-agent
        mode: autonomous
        prompt: |
          Implement the plan in {{artifact_dir}}/task-triage.json without a
          red-test-first requirement. Run repository tests, linters and validator.
          Commit changes as [{{step_id}}] chore: ...
      - id: initial-validator
        workflow: builtin:core/run-validator-v1.0.yaml
      - id: initial-validation-gate
        command: |
          mkdir -p "{{artifact_dir}}/logs"
          if agent-validator run --report >"{{artifact_dir}}/logs/{{step_id}}.log" 2>&1; then printf passed; else printf failed; exit 1; fi
        capture: validator_status
        continue_on_failure: true
      - id: repair-initial-validation
        session: implementor-agent
        mode: autonomous
        skip_if: previous_success
        prompt: |
          Repair {{artifact_dir}}/logs/initial-validation-gate.log, run checks,
          and commit changes as [{{step_id}}] chore: ...
          For a CHECK failure not caused by this branch or whose only remedy redirects a dependency source (git, URL, fork or tarball overrides/resolutions, new registries, or unvetted packages), do not apply or commit a remedy; leave the check failing and report it for a human decision.
      - id: recheck-initial-validation
        command: |
          mkdir -p "{{artifact_dir}}/logs"
          if agent-validator run --report >"{{artifact_dir}}/logs/{{step_id}}.log" 2>&1; then printf passed; else printf failed; exit 1; fi
        capture: validator_status
        skip_if: 'sh: test "{{validator_status}}" = passed'
      - id: test-flows
        session: tester-agent
        mode: autonomous
        capture: test_flow_report
        skip_if: 'sh: test "{{validator_status}}" != passed || test "{{user_visible}}" != true'
        prompt: |
          Exercise representative user-facing tooling flows changed by this Task.
          Report concrete evidence, defects and limitations. Do not edit code.
      - id: scope-floor-for-review
        command: python3 .agent-runner/workflows/task-scope-floor.py "{{scope_base}}"
        capture: scope_floor
      - id: review-task
        session: lead-agent
        mode: autonomous
        capture: review_report
        prompt: |
          Review the complete diff, validator, tester report and scope floor
          {{scope_floor}}. Identify concrete
          correctness or task-boundary findings. Do not edit code.
      - id: record-pre-findings-head
        command: git rev-parse HEAD
        capture: pre_findings_head
      - id: address-findings
        session: implementor-agent
        mode: autonomous
        prompt: |
          Address in-scope findings from {{review_report}} and tester evidence.
          Commit changes as [{{step_id}}] chore: ... Do not widen Task scope.
      - id: final-validator
        workflow: builtin:core/run-validator-v1.0.yaml
      - id: final-validation-gate
        command: |
          mkdir -p "{{artifact_dir}}/logs"
          if agent-validator run --report >"{{artifact_dir}}/logs/{{step_id}}.log" 2>&1 && test -z "$(git status --porcelain)"; then printf passed; else printf failed; exit 1; fi
        capture: validator_status
        continue_on_failure: true
      - id: repair-final-validation
        session: implementor-agent
        mode: autonomous
        skip_if: 'sh: test "{{validator_status}}" = passed'
        prompt: |
          Repair final validation, ensure a clean committed tree, and commit
          changes as [{{step_id}}] chore: ...
          For a CHECK failure not caused by this branch or whose only remedy redirects a dependency source (git, URL, fork or tarball overrides/resolutions, new registries, or unvetted packages), do not apply or commit a remedy; leave the check failing and report it for a human decision.
      - id: recheck-final-validation
        command: |
          mkdir -p "{{artifact_dir}}/logs"
          if agent-validator run --report >"{{artifact_dir}}/logs/{{step_id}}.log" 2>&1 && test -z "$(git status --porcelain)"; then printf passed; else printf failed; exit 1; fi
        capture: validator_status
        skip_if: 'sh: test "{{validator_status}}" = passed'
      - id: prepush-guard
        workflow: factory-task-guard-v1.0.yaml
        params:
          base: "{{scope_base}}"
          mode: prepush
          artifact_dir: "{{artifact_dir}}"
        skip_if: 'sh: test "{{validator_status}}" != passed'
      - id: read-prepush-scope
        command: python3 .agent-runner/workflows/scope-state.py status "{{artifact_dir}}/scope-prepush.json"
        capture: scope_status
        skip_if: 'sh: test "{{validator_status}}" != passed'
      - id: normalize-chore-commits
        command: python3 .agent-runner/workflows/normalize-chore-commits.py "{{scope_base}}"
        continue_on_failure: true
        skip_if: 'sh: test "{{validator_status}}" != passed || test "{{scope_status}}" != clean'
      - id: record-prefinalize-head
        command: git rev-parse HEAD
        capture: prefinalize_head
      - id: seed-ci-status-attempted
        command: printf passed
        capture: ci_status
      - id: finalize-pr
        workflow: builtin:core/finalize-pr-v1.0.yaml
        params:
          ci_fix_cycles: "3"
        skip_if: 'sh: test "{{validator_status}}" != passed || test "{{scope_status}}" != clean'
        continue_on_failure: true
      - id: mark-ci-failed
        command: printf failed
        capture: ci_status
        skip_if: previous_success
      - id: postfinalize-guard
        workflow: factory-task-guard-v1.0.yaml
        params:
          base: "{{scope_base}}"
          mode: postfinalize
          artifact_dir: "{{artifact_dir}}"
        skip_if: 'sh: test "$(git rev-parse HEAD)" = "{{prefinalize_head}}"'
        # A guard that stops after the push must still reach record-outcome with the PR,
        # which reports it `failed` because scope-postfinalize.json is not complete.
        continue_on_failure: true
      - id: record-pr-details
        command: |
          branch=$(git branch --show-current)
          gh pr list --head "$branch" --state open --json url,number,headRefOid --limit 1 | jq -c '.[0] // {}'
        capture: pr_details
        continue_on_failure: true
      - id: annotate-chore-pr
        script: annotate-chore-pr.sh
        script_inputs:
          artifact_dir: "{{artifact_dir}}"
          issue_file: "{{issue_file}}"
        capture: annotation_status
        continue_on_failure: true

  - id: record-outcome
    script: record-outcome.sh
    skip_if: 'sh: test "{{doable}}" != true'
    script_inputs:
      contract: factory-task/1
      outcome_path: "{{artifact_dir}}/task-outcome.json"
      validator_status: "{{validator_status}}"
      ci_status: "{{ci_status}}"
      branch_name: "{{branch_name}}"
      pr_details: "{{pr_details}}"
      annotation_status: "{{annotation_status}}"
      reasons: "{{failure_reasons}}"
      scope_path: "{{artifact_dir}}/scope-prepush.json"
      post_scope_path: "{{artifact_dir}}/scope-postfinalize.json"
      prefinalize_head: "{{prefinalize_head}}"

  - id: verify-outcome
    command: |
      python3 - "{{artifact_dir}}/task-outcome.json" <<'PY'
      import json, sys
      from pathlib import Path
      outcome = json.loads(Path(sys.argv[1]).read_text()).get("outcome")
      if outcome not in ("pull-request", "needs-input", "failed"):
          sys.exit(f"task-outcome.json has an invalid or missing outcome: {outcome}")
      PY
